[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-class-conditional-autoencoders"
version = "0.2.0"
description = "Reproducible unified and class-conditional convolutional autoencoder experiments on MNIST"
authors = [{ name = "Keval Dilipbhai Patel" }]
license = { file = "LICENSE" }
keywords = ["autoencoder", "MNIST", "PyTorch", "reproducible research", "negative results"]

readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]
media = [
  "imageio-ffmpeg>=0.5,<1",
  "pillow>=10,<12",
]


[project.scripts]
mnist-ae = "mnist_autoencoder.cli:main"
mnist-ae-benchmark = "mnist_autoencoder.benchmark:main"

[project.urls]
Repository = "https://github.com/Keval-7503/mnist-class-conditional-autoencoders"
Results = "https://github.com/Keval-7503/mnist-class-conditional-autoencoders/blob/main/results/RESULTS.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "2nd.ipynb",
  "main.ipynb",
  "MNIST_CSV",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
