<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">MNIST Autoencoders: From Exploration to Reproducible Research</title>
  <desc id="desc">A LinkedIn project card showing an encoder, latent vector, decoder, and four reproducibility improvements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091426"/>
      <stop offset="1" stop-color="#152a4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58d6ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="210" fill="#477dff" opacity="0.09"/>
  <circle cx="40" cy="620" r="250" fill="#24d8c4" opacity="0.07"/>

  <text x="70" y="93" fill="#84e6ff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">REPRODUCIBLE ML STUDY</text>
  <text x="70" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="750">MNIST Autoencoders</text>
  <text x="70" y="198" fill="#c9d7ee" font-family="Segoe UI, Arial, sans-serif" font-size="27">From exploratory notebook to defensible experiment</text>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="200" height="120" rx="22" fill="#102541" stroke="#4bd7ff" stroke-width="2"/>
    <rect x="325" y="250" width="200" height="120" rx="22" fill="#102541" stroke="#728fff" stroke-width="2"/>
    <rect x="580" y="250" width="200" height="120" rx="22" fill="#102541" stroke="#a079ff" stroke-width="2"/>
    <path d="M270 310 H315 M525 310 H570" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <path d="M306 299 L318 310 L306 321 M561 299 L573 310 L561 321" fill="none" stroke="#77bdff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="170" y="300" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Encoder</text>
    <text x="170" y="337" text-anchor="middle" fill="#9cb3d2" font-family="Segoe UI, Arial, sans-serif" font-size="20">28×28 → features</text>
    <text x="425" y="300" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">64-D latent</text>
    <text x="425" y="337" text-anchor="middle" fill="#9cb3d2" font-family="Segoe UI, Arial, sans-serif" font-size="20">shared coordinates</text>
    <text x="680" y="300" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Decoder</text>
    <text x="680" y="337" text-anchor="middle" fill="#9cb3d2" font-family="Segoe UI, Arial, sans-serif" font-size="20">features → 28×28</text>
  </g>

  <g transform="translate(835 238)">
    <rect width="300" height="260" rx="28" fill="#f6f9ff"/>
    <text x="32" y="54" fill="#12213b" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="750">AUDIT → REDESIGN</text>
    <g fill="#182d4d" font-family="Segoe UI, Arial, sans-serif" font-size="19">
      <circle cx="42" cy="96" r="9" fill="#20bfa9"/><text x="66" y="103">Canonical test split</text>
      <circle cx="42" cy="137" r="9" fill="#20bfa9"/><text x="66" y="144">Seeded validation</text>
      <circle cx="42" cy="178" r="9" fill="#20bfa9"/><text x="66" y="185">Complete metrics</text>
      <circle cx="42" cy="219" r="9" fill="#20bfa9"/><text x="66" y="226">Tests + CI</text>
    </g>
  </g>

  <rect x="70" y="448" width="710" height="2" fill="url(#accent)" opacity="0.8"/>
  <text x="70" y="503" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">The lesson: validate the comparison, not just the visualization.</text>
  <text x="70" y="557" fill="#93a9c7" font-family="Segoe UI, Arial, sans-serif" font-size="19">PyTorch · Autoencoders · Latent-space analysis · Research engineering</text>
</svg>

